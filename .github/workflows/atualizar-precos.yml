name: Atualizar preços do catálogo

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-precos
  cancel-in-progress: false

jobs:
  atualizar:
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validar código e motor de compatibilidade
        run: |
          node --check motor.js
          node --check scripts/sync-prices.mjs
          node tests/motor.test.mjs

      - name: Sincronizar ofertas de fonte autorizada
        env:
          PCMASTER_OFFERS_FEED_URL: ${{ secrets.PCMASTER_OFFERS_FEED_URL }}
          PCMASTER_AWIN_FEED_URL: ${{ secrets.PCMASTER_AWIN_FEED_URL }}
          PCMASTER_AWIN_BEARER_TOKEN: ${{ secrets.PCMASTER_AWIN_BEARER_TOKEN }}
          PCMASTER_AWIN_STORE_NAME: ${{ secrets.PCMASTER_AWIN_STORE_NAME }}
        run: |
          if [ -z "$PCMASTER_OFFERS_FEED_URL" ] && [ -z "$PCMASTER_AWIN_FEED_URL" ]; then
            echo "::warning::Integração pendente. Configure um feed autorizado nos Secrets do repositório."
            exit 0
          fi
          node scripts/sync-prices.mjs

      - name: Salvar catálogo atualizado
        run: |
          if git diff --quiet -- catalogo.json; then
            echo "Nenhuma mudança no catálogo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git commit -m "Atualiza preços e disponibilidade do catálogo"
          git push
