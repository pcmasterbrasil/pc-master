name: Atualizar preços do catálogo

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sincronizar ofertas do feed autorizado
        env:
          PCMASTER_OFFERS_FEED_URL: ${{ secrets.PCMASTER_OFFERS_FEED_URL }}
        run: |
          if [ -z "$PCMASTER_OFFERS_FEED_URL" ]; then
            echo "::warning::Integração pendente. Configure o segredo PCMASTER_OFFERS_FEED_URL com um feed/API autorizado."
            exit 0
          fi
          node scripts/sync-prices.mjs

      - name: Salvar catálogo atualizado
        run: |
          if git diff --quiet -- catalogo.json; then
            echo "Nenhuma mudança no catálogo."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git commit -m "Atualiza preços e disponibilidade do catálogo"
          git push
