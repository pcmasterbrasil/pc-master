name: Atualizar preços do catálogo

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-precos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Consultar feed autorizado de ofertas
        if: ${{ secrets.PCMASTER_OFFERS_FEED_URL != '' }}
        env:
          PCMASTER_OFFERS_FEED_URL: ${{ secrets.PCMASTER_OFFERS_FEED_URL }}
        run: node scripts/sync-prices.mjs

      - name: Informar ausência de integração
        if: ${{ secrets.PCMASTER_OFFERS_FEED_URL == '' }}
        run: |
          echo "::warning::Atualização automática ainda não conectada: configure o segredo PCMASTER_OFFERS_FEED_URL com a URL de um feed/API autorizado."
